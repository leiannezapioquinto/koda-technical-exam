name: Verify Projexia
on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: projexia_test
          POSTGRES_USER: projexia
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U projexia -d projexia_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: projexia_test
      DB_USERNAME: projexia
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, dom, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.testing.example .env.testing
      - run: php artisan key:generate --env=testing
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: php artisan test --compact
      - run: docker build --target app -t projexia:ci .
